services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    command: ["python", "-m", "http.server", "3000", "--bind", "0.0.0.0"]
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3); assert r.status == 200 and b'<title>' in r.read()"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
