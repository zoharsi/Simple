services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app:ro
      - dev_tools:/opt/dev-tools
    command:
      - sh
      - -ec
      - |
        npm install --prefix /opt/dev-tools --no-save --package-lock=false --no-audit --no-fund live-server@1.2.2
        exec /opt/dev-tools/node_modules/.bin/live-server /app --host=0.0.0.0 --port=3000 --no-browser --watch=/app/index.html
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(3000)}).then(async r => {if (!r.ok || !(await r.text()).includes('id=\"keys\"')) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  dev_tools:
